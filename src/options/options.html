<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multilektor — Ustawienia</title>
<link rel="icon" href="../../icon-16.png">
<style>
  /* [VOX] 2026-10-20: wygląd jak strona ustawień VoxNemesis (indygo, karty, przełączniki). */
  :root { --bg:#141233; --card:#1d1a47; --line:#2f2b6b; --txt:#eef0ff; --muted:#9aa0c8; --acc:#818cf8; --acc2:#6366f1; --ok:#34d399; --err:#f87171; --warn:#fcd34d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:linear-gradient(135deg,#141233,#1e1b4b 60%,#26236b); background-attachment:fixed; color:var(--txt); font:15px/1.55 'Segoe UI', system-ui, Arial, sans-serif; min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .ui-lang-row { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; }   /* [AGENT-EXP] 2026-10-21 */
  .ui-lang-row select { width:auto; min-width:110px; }
  header img { width:40px; height:40px; border-radius:8px; border:1px solid var(--line); }
  h1 { margin:0; font-size:22px; font-weight:500; }
  h1 b { color:var(--acc); font-weight:600; }
  #status { margin-left:auto; padding:6px 14px; border-radius:6px; font-size:13px; background:rgba(0,0,0,.25); border:1px solid var(--line); color:var(--muted); }
  #status.ok { color:var(--ok); border-color:#1f6b52; }
  #status.err { color:var(--err); border-color:#6b2b2b; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-width:0; }
  section.wide { grid-column:1 / -1; }
  section h2 { margin:0 0 4px; font-size:16px; font-weight:600; }
  section .sub { color:var(--muted); font-size:12px; margin:0 0 12px; }
  .row { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
  .row.first, h2 + .sub + .row { border-top:none; }
  /* [AGENT-EXP] 2026-10-17: opis ma min. ~220 px; gdy pole (lista, tekst) się nie mieści obok, schodzi pod opis —
     wcześniej długa lista ściskała opis do jednego wyrazu na linię */
  .row .lbl { flex:1 1 220px; min-width:0; }
  .row > select { flex:0 1 auto; max-width:100%; min-width:0; margin-left:auto; }
  .row > input[type=text], .row > input[type=password] { flex:1 1 100%; }
  .row .lbl b { display:block; font-weight:600; font-size:14px; }
  .row .lbl span { color:var(--muted); font-size:12px; }
  .val { min-width:64px; text-align:right; font-variant-numeric:tabular-nums; color:var(--acc); font-weight:600; font-size:14px; }
  input[type=range] { flex:1 1 120px; min-width:90px; accent-color:var(--acc2); }
  input[type=checkbox], input[type=radio] { accent-color:var(--acc2); }
  select, input[type=text], input[type=password], input[type=number], input[type=search], input[type=url] { background:rgba(0,0,0,.3); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; font-family:inherit; max-width:100%; outline:none; }
  select:focus, input:focus, textarea:focus { border-color:var(--acc); box-shadow:0 0 0 2px rgba(129,140,248,.25); }
  select { max-width:260px; cursor:pointer; }
  select option { background:#1d1a47; }
  input[type=text], input[type=password], input[type=search], input[type=url] { flex:1 1 200px; min-width:0; }
  textarea { width:100%; background:rgba(0,0,0,.3); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:10px; font:12px/1.5 ui-monospace, Consolas, monospace; resize:vertical; min-height:110px; outline:none; }
  .btn { padding:8px 14px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:rgba(255,255,255,.06); color:var(--txt); font-size:13px; font-family:inherit; }
  .btn:hover { background:rgba(255,255,255,.12); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { background:var(--acc2); border-color:var(--acc2); color:#fff; font-weight:600; }
  .btn.primary:hover { background:#4f46e5; }
  .btn.danger { color:#fecaca; border-color:#7f1d1d; background:rgba(127,29,29,.35); }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .sw { position:relative; width:44px; height:24px; flex:none; cursor:pointer; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:#2a2760; border-radius:24px; transition:.15s; }
  .sw span::before { content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:var(--muted); border-radius:50%; transition:.15s; }
  .sw input:checked + span { background:#3730a3; }
  .sw input:checked + span::before { transform:translateX(20px); background:var(--acc); }
  .sw input:focus-visible + span { outline:2px solid var(--acc); outline-offset:2px; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  .live { color:var(--ok); font-size:12px; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
  .live.warn { color:var(--warn); }
  .live.err { color:var(--err); }
  .warn { color:var(--warn); }
  .log { font:12px/1.5 ui-monospace, Consolas, monospace; color:var(--muted); white-space:pre-wrap; word-break:break-word; max-height:160px; overflow-y:auto; margin-top:8px; background:rgba(0,0,0,.25); border-radius:6px; padding:8px; }
  .chip { display:flex; align-items:center; gap:8px; padding:6px 8px; margin-top:6px; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:6px; font:12px ui-monospace, Consolas, monospace; word-break:break-all; }
  .chip b { color:var(--acc); }
  .chip .x { margin-left:auto; cursor:pointer; color:var(--err); }
  #kResult { font-size:12px; color:var(--muted); margin-top:8px; word-break:break-word; white-space:pre-wrap; }
  a { color:var(--acc); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(129,140,248,.35); border-radius:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  @media (max-width:560px) { body { padding:16px; } .grid { grid-template-columns:1fr; } select { max-width:100%; } }
</style>
<!-- [AGENT-EXP] 2026-10-21: język interfejsu (PL / EN) -->
<script src="../../assets/i18n_en.js"></script>
<script src="../../assets/i18n.js" data-page></script>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../../icon-128.png" alt="">
    <h1>Multilektor — <b>Ustawienia</b></h1>
    <label class="ui-lang-row" data-noi18n>🌐 <select class="ui-lang" data-ui-lang title="Język interfejsu / Interface language" aria-label="Język interfejsu / Interface language"><option value="auto">Auto</option><option value="pl">Polski</option><option value="en">English</option></select></label><!-- [AGENT-EXP] 2026-10-21 -->
    <div id="status">Ustawienia zapisują się automatycznie.</div>
  </header>
  <div class="grid" id="grid"></div>
</div>
<!-- [AGENT-EXP] 2026-10-15: słownik fraz (idiomy z Pipera) dla AI Subtitle Translatora — przed options.js -->
<script src="../../assets/phrase_dict.js"></script>
<script src="options.js"></script>
</body>
</html>
