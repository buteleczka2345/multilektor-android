<!DOCTYPE html>
<!-- 🎤 Mój głos → tekst: mikrofon → (DeepFilterNet3) → rozpoznawanie Google → pole z kursorem na stronie -->
<html lang="pl">
<head>
<meta charset="utf-8">
<title>🎤 Mój głos → tekst</title>
<style>
    body { font: 12px/1.35 Arial, sans-serif; background: #1a1d24; color: #eee; margin: 8px; }
    #state { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    .rec { color: #ff8a80; } .wait { color: #ffd479; } .err { color: #ff9090; } .pause { color: #9e9e9e; }
    .meter { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 3px 0 5px; }
    .meter div { height: 100%; width: 0; background: #66bb6a; transition: width .08s; }
    .info { color: #ce93d8; font-size: 11px; }
    #live { background: #263238; border-radius: 5px; padding: 5px 6px; min-height: 34px; color: #b3e5fc;
            white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
    #sent { color: #9ccc65; font-size: 11px; white-space: pre-wrap; max-height: 48px; overflow: hidden; }
    .btns { display: flex; gap: 5px; margin-top: 6px; }
    button { flex: 1; background: #2d3340; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px; font: 12px Arial; cursor: pointer; }
    #stop { background: #4a2a2a; }
</style>
<!-- [AGENT-EXP] 2026-10-21: język interfejsu (PL / EN) -->
<script src="../assets/i18n_en.js"></script>
<script src="../assets/i18n.js" data-page></script>
</head>
<body>
<div id="state" class="wait">Uruchamiam…</div>
<div class="meter"><div id="lvl"></div></div>
<div class="info" id="dfn"></div>
<div class="info" id="loc"></div>
<button id="locBtn" style="display:none;background:#1e3a55;width:100%;margin-top:4px;">⬇ Pobierz lokalny model mowy</button>
<div id="live" data-noi18n></div>
<div id="sent" data-noi18n></div>
<div class="btns">
    <button id="pause">⏸ Pauza</button>
    <button id="stop">✕ Zakończ (Alt+Shift+1)</button>
</div>
<script type="module" src="glos.js"></script>
</body>
</html>
