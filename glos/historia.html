<!DOCTYPE html>
<!-- 📜 Napisy na bieżąco: gotowe (zatwierdzone, już bez zmian) napisy z filmu, dopisywane na dole -->
<html lang="pl">
<head>
<meta charset="utf-8">
<title>📜 Napisy na bieżąco</title>
<style>
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; font: 12px/1.35 Arial, sans-serif; background: #14161c; color: #eee; }
    /* [AGENT-EXP] #app da się przenieść do okienka „📌 na wierzchu” (Document Picture-in-Picture) */
    #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #pipNote { display: none; padding: 20px 12px; color: #b3e5fc; font-size: 13px; }
    #pipNote button { margin-top: 10px; background: #2d3340; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 5px 9px; cursor: pointer; }
    #pip.on { background: #2e7d32; }
    #bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px 8px; background: #1e222b; border-bottom: 1px solid #333; }
    #bar button { background: #2d3340; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 3px 7px; font: 11px Arial; cursor: pointer; }
    #bar label { font-size: 11px; color: #ccc; }
    #count { margin-left: auto; color: #888; font-size: 10.5px; }
    #list { flex: 1; overflow-y: auto; padding: 6px 10px 30px; }
    .it { padding: 5px 0; border-bottom: 1px solid #262a33; }
    .t { color: #777; font-size: 0.75em; margin-right: 6px; }
    .pl { color: #ffee58; }
    .en { color: #8fa3b3; font-size: 0.8em; margin-top: 1px; }
    .sep { margin: 12px 0 4px; padding: 4px 8px; border-radius: 5px; background: #24324a; color: #b3e5fc; font-size: 0.85em; }
    #app.noen .en { display: none; }
    #empty { color: #888; padding: 20px 10px; }
</style>
<!-- [AGENT-EXP] 2026-10-21: język interfejsu (PL / EN) -->
<script src="../assets/i18n_en.js"></script>
<script src="../assets/i18n.js" data-page></script>
</head>
<body>
<div id="pipNote">📌 Napisy są w okienku na wierzchu (nad innymi oknami).<br><button id="pipBack">↩ Wróć tutaj</button></div>
<div id="app">
<div id="bar">
    <button id="pip" title="okienko zawsze na wierzchu — nie chowa się za Chrome ani za filmem">📌 Na wierzchu</button>
    <button id="smaller" title="mniejsza czcionka">A−</button>
    <button id="bigger" title="większa czcionka">A+</button>
    <label><input type="checkbox" id="follow" checked> przewijaj na bieżąco</label>
    <label><input type="checkbox" id="showEn" checked> oryginał</label>
    <button id="copy">📋 Kopiuj</button>
    <button id="clear">🗑 Wyczyść</button>
    <span id="count"></span>
</div>
<div id="list"><div id="empty">Tu pojawią się gotowe napisy z filmu (całe zdania, już bez zmian).<br>Włącz „🎧 Film w tej karcie → napisy” (Alt+Shift+2).</div></div>
</div>
<script type="module" src="historia.js"></script>
</body>
</html>
